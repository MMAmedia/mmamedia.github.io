<style>
:root {
  --gold: #d6ad55;
  --bg: #090909;
  --panel: #141414;
  --muted: #999;
  --border: #292929;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: #f5f5f5;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  padding: 25px 6%;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span { color: var(--gold); }

header small {
  color: var(--muted);
  letter-spacing: 2px;
}

.hero {
  text-align: center;
  padding: 65px 20px 35px;
}

.hero h1 {
  font-size: clamp(35px, 6vw, 60px);
  margin: 0 0 12px;
  letter-spacing: 3px;
}

.hero h1 span { color: var(--gold); }

.hero p { color: var(--muted); }

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.search {
  width: 100%;
  padding: 17px;
  background: #171717;
  color: white;
  border: 1px solid #333;
  border-radius: 7px;
  font-size: 16px;
  outline: none;
  margin-bottom: 25px;
}

.search:focus { border-color: var(--gold); }

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 22px;
}

.toolbar h2 {
  font-size: 17px;
  letter-spacing: 2px;
}

.toolbar span { color: var(--gold); }

.alphabet {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 25px;
}

.alphabet button {
  background: #171717;
  border: 1px solid var(--border);
  color: #ccc;
  padding: 7px 10px;
  cursor: pointer;
  border-radius: 4px;
}

.alphabet button:hover {
  background: var(--gold);
  color: black;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 14px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 20px;
  border-radius: 7px;
  cursor: pointer;
  transition: .2s;
}

.card:hover {
  border-color: var(--gold);
  transform: translateY(-3px);
}

.initials {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  background: #292317;
  color: var(--gold);
  font-weight: bold;
  border-radius: 50%;
  margin-bottom: 16px;
}

.card h3 { margin: 0 0 8px; }

.card p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}

.card .arrow {
  color: var(--gold);
  float: right;
}

.profile {
  display: none;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 30px;
  margin-top: 20px;
}

.back {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 4px;
  margin-bottom: 25px;
}

.profile h1 {
  font-size: 36px;
  margin-bottom: 5px;
}

.profile .nickname {
  color: var(--gold);
  font-size: 18px;
}

.details {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin: 30px 0;
}

.detail {
  background: #1c1c1c;
  padding: 17px;
  border-radius: 5px;
}

.detail small {
  display: block;
  color: var(--muted);
  margin-bottom: 8px;
}

.detail strong { font-size: 16px; }

.profile h2 {
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
}

.notice {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.empty {
  color: var(--muted);
  padding: 30px;
  text-align: center;
  grid-column: 1/-1;
}

footer {
  text-align: center;
  padding: 35px 15px;
  margin-top: 60px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
}

footer span { color: var(--gold); }

@media(max-width:600px) {
  header { padding: 20px; }
  header small { display: none; }
  .profile { padding: 20px; }
}
</style>
