
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="H0ZS6fMXmqeoVIKF8ISfKIhSn3132TvZBllC0p6esVo">
<title>MMA MEDIA | The Fighter Database</title>

<style>
:root {
  --gold: #d6ad55;
  --bg: #090909;
  --panel: #141414;
  --muted: #999;
  --border: #292929;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: #f5f5f5;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  padding: 25px 6%;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span { color: var(--gold); }

header small {
  color: var(--muted);
  letter-spacing: 2px;
}

.hero {
  text-align: center;
  padding: 65px 20px 35px;
}

.hero h1 {
  font-size: clamp(35px, 6vw, 60px);
  margin: 0 0 12px;
  letter-spacing: 3px;
}

.hero h1 span { color: var(--gold); }

.hero p { color: var(--muted); }

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.search {
  width: 100%;
  padding: 17px;
  background: #171717;
  color: white;
  border: 1px solid #333;
  border-radius: 7px;
  font-size: 16px;
  outline: none;
  margin-bottom: 25px;
}

.search:focus { border-color: var(--gold); }

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 22px;
}

.toolbar h2 {
  font-size: 17px;
  letter-spacing: 2px;
}

.toolbar span { color: var(--gold); }

.alphabet {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 25px;
}

.alphabet button {
  background: #171717;
  border: 1px solid var(--border);
  color: #ccc;
  padding: 7px 10px;
  cursor: pointer;
  border-radius: 4px;
}

.alphabet button:hover {
  background: var(--gold);
  color: black;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 14px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 20px;
  border-radius: 7px;
  cursor: pointer;
  transition: .2s;
}

.card:hover {
  border-color: var(--gold);
  transform: translateY(-3px);
}

.initials {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  background: #292317;
  color: var(--gold);
  font-weight: bold;
  border-radius: 50%;
  margin-bottom: 16px;
}

.card h3 { margin: 0 0 8px; }

.card p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}

.card .arrow {
  color: var(--gold);
  float: right;
}

.profile {
  display: none;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 30px;
  margin-top: 20px;
}

.back {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 4px;
  margin-bottom: 25px;
}

.profile h1 {
  font-size: 36px;
  margin-bottom: 5px;
}

.profile .nickname {
  color: var(--gold);
  font-size: 18px;
}

.details {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin: 30px 0;
}

.detail {
  background: #1c1c1c;
  padding: 17px;
  border-radius: 5px;
}

.detail small {
  display: block;
  color: var(--muted);
  margin-bottom: 8px;
}

.detail strong { font-size: 16px; }

.profile h2 {
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
}

.notice {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.empty {
  color: var(--muted);
  padding: 30px;
  text-align: center;
  grid-column: 1/-1;
}

footer {
  text-align: center;
  padding: 35px 15px;
  margin-top: 60px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
}

footer span { color: var(--gold); }

@media(max-width:600px) {
  header { padding: 20px; }
  header small { display: none; }
  .profile { padding: 20px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">MMA <span>MEDIA</span></div>
  <small>THE FIGHTER DATABASE</small>
</header>

<section class="hero">
  <h1>THE WORLD OF <span>MMA</span></h1>
  <p>Explore the fighters. Discover their stories.</p>
</section>

<main class="container">

  <section id="directory">
    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search fighters..."
      autocomplete="off"
    >

    <div class="toolbar">
      <h2>FIGHTER DIRECTORY</h2>
      <span id="count">100 FIGHTERS</span>
    </div>

    <div class="alphabet" id="alphabet"></div>
    <div class="grid" id="fighters"></div>
  </section>

  <section class="profile" id="profile"></section>

</main>

<footer>
  MMA <span>MEDIA</span> — THE FIGHTER DATABASE
  <p>Records and fighter information should be independently verified.</p>
</footer>

<script>
const fighterNames = [
"Aaron Pico",
"Abdulmanap Nurmagomedov",
"Adesanya Israel",
"Adrian Yanez",
"Alexander Gustafsson",
"Alexander Volkanovski",
"Alex Pereira",
"Aljamain Sterling",
"Alistair Overeem",
"Amir Albazi",
"Anderson Silva",
"Anthony Johnson",
"Arman Tsarukyan",
"Arnold Allen",
"Asu Almabayev",
"Belal Muhammad",
"Beneil Dariush",
"Benoit Saint Denis",
"Bo Nickal",
"Brandon Moreno",
"Brandon Royval",
"Brian Ortega",
"Cain Velasquez",
"Caio Borralho",
"Carlos Prates",
"Charles Oliveira",
"Charles Johnson",
"Chris Weidman",
"Cory Sandhagen",
"Ciryl Gane",
"Colby Covington",
"Conor McGregor",
"Cub Swanson",
"Daniel Cormier",
"Dan Hooker",
"Deiveson Figueiredo",
"Derrick Lewis",
"Diego Lopes",
"Dominick Cruz",
"Dustin Poirier",
"Drew Dober",
"Edson Barboza",
"Francis Ngannou",
"Georges St-Pierre",
"Gilbert Burns",
"Henry Cejudo",
"Islam Makhachev",
"Ilia Topuria",
"Jack Della Maddalena",
"Jamahal Hill",
"Jared Cannonier",
"Jiri Prochazka",
"Joanna Jedrzejczyk",
"Joe Pyfer",
"Jon Jones",
"Jose Aldo",
"Joshua Van",
"Justin Gaethje",
"Kamaru Usman",
"Karine Silva",
"Kayla Harrison",
"Kevin Holland",
"Khabib Nurmagomedov",
"Kyoji Horiguchi",
"Leon Edwards",
"Manel Kape",
"Max Holloway",
"Merab Dvalishvili",
"Michael Chandler",
"Michael Bisping",
"Michael Morales",
"Michel Pereira",
"Mirko Cro Cop",
"Nate Diaz",
"Nassourdine Imavov",
"Nick Diaz",
"Nick Newell",
"Paulo Costa",
"Paddy Pimblett",
"Petr Yan",
"Rafael Fiziev",
"Randy Couture",
"Robert Whittaker",
"Robbie Lawler",
"Rose Namajunas",
"Sean O'Malley",
"Sean Strickland",
"Sergei Pavlovich",
"Shavkat Rakhmonov",
"Stephen Thompson",
"Stipe Miocic",
"Tai Tuivasa",
"Tatiana Suarez",
"Tom Aspinall",
"Tony Ferguson",
"Valentina Shevchenko",
"Virna Jandiroba",
"Zabit Magomedsharipov"
];

// Correct the display order alphabetically.
fighterNames.sort((a,b) => a.localeCompare(b));

const fighters = fighterNames.map((name, index) => ({
  id: "fighter-" + index,
  name,
  nickname: "Not yet verified",
  division: "Not yet verified",
  record: "Not yet verified",
  promotion: "MMA",
  style: "Not yet verified",
  hometown: "Not yet verified",
  bio: "Fighter profile awaiting independently verified information.",
  community: false
}));

// Community-submitted profile.
fighters.push({
  id: "kye-trimble",
  name: "Kye Trimble",
  nickname: "Turbo",
  division: "Flyweight",
  record: "Not independently verified",
  promotion: "Community profile",
  style: "Muay Thai / MMA",
  hometown: "Birmingham, England",
  bio: "A community-submitted fighter profile. Information supplied by the profile owner and not independently verified.",
  community: true
});

fighters.sort((a,b) => a.name.localeCompare(b.name));

const grid = document.getElementById("fighters");
const search = document.getElementById("search");
const directory = document.getElementById("directory");
const profile = document.getElementById("profile");
const count = document.getElementById("count");
const alphabet = document.getElementById("alphabet");

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function initials(name) {
  return name.split(" ").map(part => part[0]).slice(0,2).join("").toUpperCase();
}

function renderAlphabet() {
  alphabet.innerHTML = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(letter =>
    `<button type="button" data-letter="${letter}">${letter}</button>`
  ).join("");

  alphabet.querySelectorAll("button").forEach(button => {
    button.addEventListener("click", () => {
      search.value = "";
      renderFighters();
      const letter = button.dataset.letter;
      const first = [...grid.querySelectorAll(".card")]
        .find(card => card.dataset.name.startsWith(letter));
      if (first) first.scrollIntoView({behavior:"smooth", block:"center"});
    });
  });
}

function renderFighters() {
  const query = search.value.toLowerCase().trim();

  const filtered = fighters.filter(fighter =>
    fighter.name.toLowerCase().includes(query) ||
    fighter.nickname.toLowerCase().includes(query)
  );

  count.textContent = `${filtered.length} FIGHTERS`;

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">No fighters found.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(fighter => `
    <article class="card" data-name="${escapeHTML(fighter.name)}"
      data-id="${escapeHTML(fighter.id)}">
      <div class="initials">${escapeHTML(initials(fighter.name))}</div>
      <h3>${escapeHTML(fighter.name)}</h3>
      <p>${escapeHTML(fighter.promotion)}</p>
      <span class="arrow">→</span>
    </article>
  `).join("");

  grid.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openFighter(card.dataset.id));
  });
}

function openFighter(id) {
  const fighter = fighters.find(item => item.id === id);
  if (!fighter) return;

  directory.style.display = "none";
  profile.style.display = "block";

  profile.innerHTML = `
    <button class="back" id="backButton">← BACK TO DIRECTORY</button>

    <div class="initials">${escapeHTML(initials(fighter.name))}</div>
    <h1>${escapeHTML(fighter.name)}</h1>
    <div class="nickname">${escapeHTML(fighter.nickname)}</div>

    <div class="details">
      <div class="detail">
        <small>RECORD</small>
        <strong>${escapeHTML(fighter.record)}</strong>
      </div>
      <div class="detail">
        <small>DIVISION</small>
        <strong>${escapeHTML(fighter.division)}</strong>
      </div>
      <div class="detail">
        <small>PROMOTION</small>
        <strong>${escapeHTML(fighter.promotion)}</strong>
      </div>
      <div class="detail">
        <small>FIGHTING STYLE</small>
        <strong>${escapeHTML(fighter.style)}</strong>
      </div>
      <div class="detail">
        <small>HOMETOWN</small>
        <strong>${escapeHTML(fighter.hometown)}</strong>
      </div>
    </div>

    <h2>BIOGRAPHY</h2>
    <p>${escapeHTML(fighter.bio)}</p>

    <h2>FIGHT HISTORY</h2>
    <p class="notice">Fight history has not yet been independently verified.</p>

    <h2>PROFILE INFORMATION</h2>
    <p class="notice">
      ${fighter.community
        ? "Community-submitted profile. Information has not been independently verified."
        : "This profile is awaiting verified records, statistics and biography information."}
    </p>
  `;

  document.getElementById("backButton").addEventListener("click", goHome);

  history.pushState({fighter:id}, "", "#fighters/" + id);
  window.scrollTo(0,0);
}

function goHome() {
  profile.style.display = "none";
  directory.style.display = "block";
  history.pushState({}, "", location.pathname);
  window.scrollTo(0,0);
}

search.addEventListener("input", renderFighters);

window.addEventListener("popstate", () => {
  const id = location.hash.match(/^#fighters\/(.+)$/);
  if (id) {
    openFighter(id[1]);
  } else {
    profile.style.display = "none";
    directory.style.display = "block";
  }
});

renderAlphabet();
renderFighters();

const initialRoute = location.hash.match(/^#fighters\/(.+)$/);
if (initialRoute) openFighter(initialRoute[1]);

</script>
</body>
</html>
